<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Naturnest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #FAF8F5;
            --accent-color: #D97757;
            --text-dark: #2C2C2C;
            --text-light: #666666;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--primary-bg); color: var(--text-dark); line-height: 1.7; padding-top: 60px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .logo-wrap { text-align: center; margin-bottom: 60px; }
        .logo { font-family: var(--font-heading); font-size: 28px; font-weight: 700; text-decoration: none; color: var(--text-dark); letter-spacing: 1px; }
        h1 { font-family: var(--font-heading); font-size: 42px; text-align: center; margin-bottom: 20px; }
        .contact-info { text-align: center; margin-bottom: 40px; color: var(--text-light); }
        .contact-info a { color: var(--accent-color); text-decoration: none; font-weight: 700; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-family: var(--font-body); font-size: 16px; background: #fff; }
        .form-control:focus { outline: none; border-color: var(--accent-color); }
        textarea.form-control { resize: vertical; min-height: 150px; }
        .btn { display: block; width: 100%; background-color: var(--accent-color); color: #fff; border: none; padding: 18px; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; border-radius: 4px; cursor: pointer; transition: opacity 0.3s ease; }
        .btn:hover { opacity: 0.9; }
        .back-link { display: block; text-align: center; margin: 60px 0; font-weight: 700; text-decoration: none; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <a href="/" class="logo">naturnest</a>
        </div>
        <h1>Get in Touch</h1>
        <p class="contact-info">Have a question about a recipe or collaboration? Reach out to us directly at <br><a href="mailto:team@naturnest.co">team@naturnest.co</a> or use the form below.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>

        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>
</body>
</html>
